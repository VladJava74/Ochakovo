<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лови яйца!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body.game-page {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #dff5ff, #f4f9df);
            color: #263746;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .egg-game {
            width: min(100%, 760px);
            display: grid;
            grid-template-columns: 130px minmax(0, 520px);
            grid-template-areas: "left center";
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 16px 45px rgba(44, 75, 90, 0.16);
        }

        .egg-game__center {
            grid-area: center;
            min-width: 0;
            text-align: center;
        }

        .egg-game__center h1 {
            margin: 0 0 12px;
            color: #315b43;
            font-size: clamp(1.7rem, 4vw, 2.2rem);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 0 auto;
            border: 4px solid #fff;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(40, 65, 75, 0.18);
        }

        .egg-game__side {
            grid-area: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 12px;
            border-radius: 16px;
            background: rgba(232, 243, 232, 0.75);
        }

        .egg-game__info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .egg-game__stat {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            border-radius: 12px;
            background: #fff;
        }

        .egg-game__stat span {
            color: #63717a;
            font-size: 0.85rem;
        }

        .egg-game__stat b {
            color: #315b43;
            font-size: 1.2rem;
        }

        #lives {
            color: #e34f58;
            letter-spacing: 2px;
        }

        .egg-game__controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 12px auto;
        }

        .egg-game__controls button,
        .egg-game__restart {
            min-height: 42px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .egg-game__controls button {
            background: #e8f3e8;
            color: #315b43;
            font-size: 1.1rem;
        }

        .egg-game__controls button:hover {
            background: #d3e9d4;
            transform: translateY(-2px);
        }

        .egg-game__restart {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 8px 10px;
            background: #e27643;
            color: #fff;
            font-size: 0.9rem;
        }

        .egg-game__restart:hover {
            background: #c95e32;
            transform: translateY(-2px);
        }

        .egg-game__controls button:focus-visible,
        .egg-game__restart:focus-visible {
            outline: 3px solid #315b43;
            outline-offset: 3px;
        }

        .egg-game__hint {
            margin: 10px 0 0;
            color: #63717a;
            font-size: 0.8rem;
            line-height: 1.45;
        }

        @media (orientation: landscape) and (max-height: 850px) {
            body.game-page {
                padding: 8px;
            }

            .egg-game {
                gap: 12px;
                padding: 12px;
            }

            .egg-game__center h1 {
                margin-bottom: 6px;
                font-size: clamp(1.2rem, 4vh, 1.8rem);
            }

            #gameCanvas {
                width: auto;
                height: min(700px, calc(100svh - 220px));
                max-width: 100%;
                aspect-ratio: 5 / 7;
            }

            .egg-game__controls {
                margin: 8px auto;
            }
        }

        @media (max-width: 700px) {
            body.game-page {
                padding: 12px;
            }

            .egg-game {
                width: min(100%, 520px);
                grid-template-columns: 1fr;
                grid-template-areas:
                    "center"
                    "left";
                gap: 12px;
                padding: 14px;
            }

            #gameCanvas {
                width: 100%;
                height: auto;
                max-width: 400px;
            }

            .egg-game__side {
                padding: 10px;
            }

            .egg-game__info {
                flex-direction: row;
            }

            .egg-game__stat {
                flex: 1;
                min-width: 0;
                padding: 8px;
            }

            .egg-game__stat b {
                font-size: 1rem;
            }
        }

        @media (max-width: 420px) {
            .egg-game {
                gap: 8px;
                padding: 10px;
            }

            .egg-game__side {
                padding: 8px;
            }

            .egg-game__info {
                gap: 6px;
            }

            .egg-game__stat {
                gap: 2px;
                padding: 6px;
            }
        }

        @media (orientation: landscape) and (max-height: 850px) and (max-width: 700px) {
            .egg-game {
                width: min(100%, 760px);
                grid-template-columns: 90px minmax(0, 1fr);
                grid-template-areas: "left center";
                gap: 8px;
                padding: 8px;
            }

            .egg-game__info {
                flex-direction: column;
                gap: 6px;
            }

            .egg-game__stat {
                padding: 6px;
            }

            .egg-game__center h1 {
                margin-bottom: 4px;
            }

            #gameCanvas {
                width: auto;
                height: min(700px, calc(100svh - 220px));
                max-width: 100%;
                aspect-ratio: 5 / 7;
            }

            .egg-game__controls {
                margin: 6px auto;
            }

            .egg-game__hint {
                margin-top: 6px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>

<body class="game-page">
<main class="egg-game">
    <section class="egg-game__center">
        <h1>Лови яйца!</h1>

        <canvas
                id="gameCanvas"
                width="400"
                height="560"
                aria-label="Лови падающие яйца"
        ></canvas>

        <div class="egg-game__controls" aria-label="Выбрать дорожку">
            <button type="button" data-lane="0">1</button>
            <button type="button" data-lane="1">2</button>
            <button type="button" data-lane="2">3</button>
            <button type="button" data-lane="3">4</button>
        </div>

        <button type="button" id="restart" class="egg-game__restart">
            Начать заново
        </button>

        <p class="egg-game__hint">
            Управление: стрелки на клавиатуре или кнопки дорожек.
        </p>
    </section>

    <aside class="egg-game__side">
        <div class="egg-game__info">
            <div class="egg-game__stat">
                <span>Счёт</span>
                <b id="score">0</b>
            </div>

            <div class="egg-game__stat">
                <span>Жизни</span>
                <b id="lives">♥ ♥ ♥</b>
            </div>
        </div>
    </aside>
</main>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const livesElement = document.getElementById("lives");

    const laneX = [70, 157, 243, 330];
    const basketY = 492;

    const backgroundImage = new Image();
    backgroundImage.src = "/assets/background.png";

    const basketImage = new Image();
    basketImage.src = "/images/cardboard-box-resized.png";

    const eggTextures = [
        "/images/egg1.png",
        "/images/egg2.png",
        "/images/egg3.png",
        "/images/egg4.png",
        "/images/egg5.png",
        "/images/egg6.png",
        "/images/egg7.png",
        "/images/egg8.png"
    ].map(src => {
        const image = new Image();
        image.src = src;
        return image;
    });

    let eggs = [];
    let playerLane = 1;
    let score = 0;
    let lives = 3;
    let running = true;
    let lastTime = 0;
    let spawnTimer = 0;

    function resetGame() {
        eggs = [];
        playerLane = 1;
        score = 0;
        lives = 3;
        running = true;
        lastTime = 0;
        spawnTimer = 0;

        updateInfo();
    }

    function updateInfo() {
        scoreElement.textContent = score;
        livesElement.textContent = "♥ ".repeat(lives).trim() || "—";
    }

    function spawnEgg() {
        const textureIndex = Math.floor(Math.random() * eggTextures.length);

        eggs.push({
            lane: Math.floor(Math.random() * 4),
            y: 55,
            speed: 135 + score * 3,
            texture: eggTextures[textureIndex]
        });
    }

    function drawFallbackBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#c7efff");
        gradient.addColorStop(1, "#e8f7d8");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        laneX.forEach((x, index) => {
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            ctx.fillRect(x - 29, 42, 58, 442);

            ctx.strokeStyle = "#9b7957";
            ctx.lineWidth = 8;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(x - 29, 42);
            ctx.lineTo(x - 29, 484);
            ctx.moveTo(x + 29, 42);
            ctx.lineTo(x + 29, 484);
            ctx.stroke();

            for (let y = 145; y < 470; y += 105) {
                ctx.strokeStyle = "#b7834f";
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(x - 27, y);
                ctx.lineTo(x + 27, y);
                ctx.stroke();
            }

            ctx.fillStyle = "#304251";
            ctx.font = "bold 15px system-ui";
            ctx.textAlign = "center";
            ctx.fillText(String(index + 1), x, 30);
        });

        ctx.fillStyle = "#6e9a62";
        ctx.fillRect(25, 484, 350, 8);
    }

    function drawBackground() {
        if (backgroundImage.complete && backgroundImage.naturalWidth > 0) {
            ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
        } else {
            drawFallbackBackground();
        }
    }

    function drawEgg(x, y, texture) {
        if (texture && texture.complete && texture.naturalWidth > 0) {
            ctx.drawImage(texture, x - 20, y - 30, 40, 60);
            return;
        }

        ctx.fillStyle = "#fffdf2";
        ctx.strokeStyle = "#d1c8a9";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(x, y, 13, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    function drawBasket() {
        const x = laneX[playerLane];

        if (basketImage.complete && basketImage.naturalWidth > 0) {
            ctx.drawImage(basketImage, x - 68, basketY - 44, 136, 88);
            return;
        }

        ctx.fillStyle = "#df713c";
        ctx.beginPath();
        ctx.moveTo(x - 50, basketY - 20);
        ctx.lineTo(x + 50, basketY - 20);
        ctx.lineTo(x + 38, basketY + 32);
        ctx.lineTo(x - 38, basketY + 32);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "#8c4428";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x - 56, basketY - 20);
        ctx.lineTo(x + 56, basketY - 20);
        ctx.stroke();
    }

    function drawGameOver() {
        ctx.fillStyle = "rgba(20, 31, 40, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 34px system-ui";
        ctx.fillText("Игра окончена", canvas.width / 2, 250);

        ctx.font = "22px system-ui";
        ctx.fillText(`Счёт: ${score}`, canvas.width / 2, 292);

        ctx.font = "16px system-ui";
        ctx.fillText("Нажми «Начать заново»", canvas.width / 2, 330);
    }

    function draw() {
        drawBackground();

        eggs.forEach(egg => {
            drawEgg(laneX[egg.lane], egg.y, egg.texture);
        });

        drawBasket();

        if (!running) {
            drawGameOver();
        }
    }

    function update(deltaTime) {
        if (!running) return;

        spawnTimer += deltaTime;

        const spawnDelay = Math.max(430, 1050 - score * 12);

        if (spawnTimer >= spawnDelay) {
            spawnEgg();
            spawnTimer = 0;
        }

        for (let i = eggs.length - 1; i >= 0; i--) {
            const egg = eggs[i];
            egg.y += egg.speed * deltaTime / 1000;

            if (egg.y >= basketY - 12) {
                if (egg.lane === playerLane) {
                    score++;
                } else {
                    lives--;
                }

                eggs.splice(i, 1);
                updateInfo();

                if (lives <= 0) {
                    running = false;
                }
            }
        }
    }

    function gameLoop(time) {
        const deltaTime = lastTime
            ? Math.min(time - lastTime, 40)
            : 0;

        lastTime = time;

        update(deltaTime);
        draw();

        requestAnimationFrame(gameLoop);
    }

    function movePlayer(direction) {
        playerLane = Math.max(0, Math.min(3, playerLane + direction));
    }

    window.addEventListener("keydown", event => {
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
            event.preventDefault();
        }

        if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
            movePlayer(-1);
        } else if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {
            movePlayer(1);
        } else if (/^[1-4]$/.test(event.key)) {
            playerLane = Number(event.key) - 1;
        }
    });

    document.querySelectorAll("[data-lane]").forEach(button => {
        button.addEventListener("click", () => {
            playerLane = Number(button.dataset.lane);
        });
    });

    document.getElementById("restart").addEventListener("click", resetGame);

    updateInfo();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
