<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="site-header">
    <div class="site-header__top">
        <a class="site-header__logo" th:href="@{/}">
            ОЧАКОВО <span>•</span> Карьера
        </a>

        <div class="site-header__tabs" aria-label="Направление">
            <button class="tab-btn active" type="button" onclick="switchTab('office')">
                Офис
            </button>
            <button class="tab-btn" type="button" onclick="switchTab('factory')">
                Производство
            </button>
        </div>
    </div>

    <nav class="site-header__nav" aria-label="Основная навигация">
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/about}">О компании</a>
        <a th:href="@{/jobs}">Работа</a>
        <a th:href="@{/try}">Попробуй себя</a>
        <a th:href="@{/professions}">Профессии</a>
        <a th:href="@{/conditions}">Условия</a>
    </nav>
</header>
</body>
</html>
