<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование отзыва — Очаково</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f7f5eb; padding: 32px; color: #17382e; display: flex; justify-content: center; }
        .card { background: #fff; border-radius: 20px; padding: 32px; width: 100%; max-width: 560px; box-shadow: 0 12px 36px rgba(18,60,49,0.1); }
        h1 { color: #123c31; margin-bottom: 6px; font-size: 24px; }
        .subtitle { color: #718078; margin-bottom: 24px; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .form-row.full { grid-template-columns: 1fr; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #123c31; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #d5decf; border-radius: 8px; font: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #1b5944; }
        .actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn { padding: 12px 20px; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn-primary { background: #e6b84d; color: #123c31; }
        .btn-primary:hover { background: #f0c85d; }
        .btn-secondary { background: transparent; border: 1px solid #d5decf; color: #123c31; }
        .btn-secondary:hover { background: #f0f8de; }
    </style>
</head>
<body>
<div class="card">
    <h1>Редактирование отзыва</h1>
    <p class="subtitle">Отзыв #<span th:text="${fb.id}">1</span> от <span th:text="${fb.name}">Имя</span></p>

    <form th:action="@{/admin/feedback/{id}/edit(id=${fb.id})}" th:object="${fb}" method="post">
        <div class="form-row">
            <div>
                <label>Имя</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div>
                <label>Группа</label>
                <input type="text" th:field="*{studentGroup}">
            </div>
        </div>
        <div class="form-row">
            <div>
                <label>Игра 1</label>
                <input type="number" th:field="*{ratingGame1}" min="1" max="5">
            </div>
            <div>
                <label>Игра 2</label>
                <input type="number" th:field="*{ratingGame2}" min="1" max="5">
            </div>
        </div>
        <div class="form-row">
            <div>
                <label>Игра 3</label>
                <input type="number" th:field="*{ratingGame3}" min="1" max="5">
            </div>
            <div>
                <label>Общая оценка</label>
                <input type="number" th:field="*{ratingOverall}" min="1" max="5">
            </div>
        </div>
        <div class="form-row full">
            <div>
                <label>Что понравилось</label>
                <input type="text" th:field="*{likedMost}" placeholder="Дизайн, Игры">
            </div>
        </div>
        <div class="form-row full">
            <div>
                <label>Что улучшить</label>
                <textarea th:field="*{improvements}" rows="3"></textarea>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
            <a href="/admin/feedback" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
